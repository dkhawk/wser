<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Sky Sunrise Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="38%" stop-color="#1e293b"/>
      <stop offset="72%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="72%" cy="62%" r="32%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Distant Sierra Peaks -->
    <linearGradient id="farMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Mid Canyons -->
    <linearGradient id="midMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gold Buckle / Ticket Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Card Glass Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.94"/>
    </linearGradient>
  </defs>

  <!-- Rounded Frame -->
  <rect width="1000" height="320" rx="18" fill="url(#skyGrad)"/>

  <!-- Stars in High Country Sky -->
  <g fill="#fef9c3" opacity="0.65">
    <circle cx="90" cy="42" r="1.5"/>
    <circle cx="165" cy="28" r="1.2"/>
    <circle cx="260" cy="54" r="1.8"/>
    <circle cx="380" cy="25" r="1.3"/>
    <circle cx="520" cy="36" r="1.6"/>
    <circle cx="640" cy="22" r="1.2"/>
    <circle cx="835" cy="30" r="1.7"/>
    <circle cx="920" cy="48" r="1.4"/>
  </g>

  <!-- Sierra Sunrise -->
  <circle cx="720" cy="198" r="115" fill="url(#sunGlow)"/>
  <circle cx="720" cy="198" r="44" fill="#fef08a" opacity="0.9"/>

  <!-- High Sierra Granite Peaks (Escarpment & Emigrant Pass) -->
  <polygon points="0,240 85,155 155,195 250,118 340,178 445,105 545,172 645,122 735,180 830,112 925,165 1000,135 1000,320 0,320"
           fill="url(#farMountain)"/>

  <!-- Snow Caps on Peaks -->
  <g fill="#f8fafc" opacity="0.82">
    <polygon points="250,118 226,149 242,144 252,154 264,143 277,150"/>
    <polygon points="445,105 418,142 436,136 447,148 459,135 475,143"/>
    <polygon points="645,122 622,152 638,147 648,156 660,145 672,151"/>
    <polygon points="830,112 805,145 822,139 833,149 846,138 860,146"/>
  </g>

  <!-- American River Canyon Ridges -->
  <polygon points="0,265 120,210 230,245 370,192 505,238 615,198 765,242 895,188 1000,225 1000,320 0,320"
           fill="url(#midMountain)"/>

  <!-- Foreground Pine Silhouette & Western States Singletrack Trail -->
  <rect x="0" y="268" width="1000" height="52" rx="0" fill="#090d16"/>
  <path d="M 520,320 Q 610,275 680,255 T 830,215 T 925,165"
        fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="8 5" opacity="0.85"/>

  <!-- Elevation Waypoint Badges on Trail -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fef08a">
    <circle cx="565" cy="295" r="4" fill="#f59e0b"/>
    <text x="575" y="299">Olympic Valley (0 mi)</text>
    <circle cx="715" cy="245" r="4" fill="#f59e0b"/>
    <text x="725" y="249">Robinson Flat</text>
    <circle cx="848" cy="204" r="4" fill="#f59e0b"/>
    <text x="858" y="208">Foresthill</text>
    <circle cx="925" cy="165" r="5" fill="#fde047" stroke="#9a3412" stroke-width="2"/>
    <text x="840" y="156" fill="#fde047">Auburn (100.2 mi)</text>
  </g>

  <!-- Left Overlay Card: Title & Exponential Ticket Stack -->
  <rect x="28" y="26" width="525" height="268" rx="14" fill="url(#cardBg)" stroke="#475569" stroke-width="1.5"/>

  <!-- Silver/Gold 100-Mile Buckle Emblem -->
  <g transform="translate(52, 46)">
    <rect x="0" y="0" width="58" height="44" rx="10" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="5" y="5" width="48" height="34" rx="7" fill="#0f172a"/>
    <text x="29" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#fde047">WSER</text>
    <text x="29" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#f8fafc">100 MILE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="124" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    Western States 100 Lottery Solver
  </text>
  <text x="124" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#cbd5e1">
    Zero-Allocation Monte Carlo (1M Trials) &amp; Wallenius Exponential Race Engine
  </text>

  <!-- Divider -->
  <line x1="52" y1="104" x2="528" y2="104" stroke="#334155" stroke-width="1"/>

  <!-- Exponential Ticket Doubling Mini-Chart (2^(n-1)) -->
  <text x="52" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fcd34d" letter-spacing="0.6">
    EXPONENTIAL TICKET WEIGHTING: 2^(n-1) TICKETS IN THE HAT
  </text>

  <!-- Ticket Bars (1 to 1024) -->
  <g transform="translate(52, 138)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">
    <!-- 1 -->
    <rect x="0" y="78" width="34" height="8" rx="2" fill="#38bdf8"/>
    <text x="17" y="73" text-anchor="middle" fill="#bae6fd">1</text>
    <text x="17" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 1</text>

    <!-- 2 -->
    <rect x="43" y="72" width="34" height="14" rx="2" fill="#38bdf8"/>
    <text x="60" y="67" text-anchor="middle" fill="#bae6fd">2</text>
    <text x="60" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 2</text>

    <!-- 4 -->
    <rect x="86" y="65" width="34" height="21" rx="2" fill="#2dd4bf"/>
    <text x="103" y="60" text-anchor="middle" fill="#99f6e4">4</text>
    <text x="103" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 3</text>

    <!-- 8 -->
    <rect x="129" y="58" width="34" height="28" rx="2" fill="#2dd4bf"/>
    <text x="146" y="53" text-anchor="middle" fill="#99f6e4">8</text>
    <text x="146" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 4</text>

    <!-- 16 -->
    <rect x="172" y="50" width="34" height="36" rx="2" fill="#4ade80"/>
    <text x="189" y="45" text-anchor="middle" fill="#bbf7d0">16</text>
    <text x="189" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 5</text>

    <!-- 32 -->
    <rect x="215" y="42" width="34" height="44" rx="2" fill="#a3e635"/>
    <text x="232" y="37" text-anchor="middle" fill="#d9f99d">32</text>
    <text x="232" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 6</text>

    <!-- 64 -->
    <rect x="258" y="34" width="34" height="52" rx="2" fill="#facc15"/>
    <text x="275" y="29" text-anchor="middle" fill="#fef08a">64</text>
    <text x="275" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 7</text>

    <!-- 128 -->
    <rect x="301" y="25" width="34" height="61" rx="2" fill="#fb923c"/>
    <text x="318" y="20" text-anchor="middle" fill="#fed7aa">128</text>
    <text x="318" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 8</text>

    <!-- 256 -->
    <rect x="344" y="16" width="34" height="70" rx="2" fill="#f97316"/>
    <text x="361" y="11" text-anchor="middle" fill="#ffedd5">256</text>
    <text x="361" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 9</text>

    <!-- 512 -->
    <rect x="387" y="8" width="34" height="78" rx="2" fill="#ef4444"/>
    <text x="404" y="3" text-anchor="middle" fill="#fecaca">512</text>
    <text x="404" y="100" text-anchor="middle" fill="#94a3b8" font-size="9">Yr 10</text>

    <!-- 1024 -->
    <rect x="430" y="0" width="44" height="86" rx="2" fill="url(#goldGrad)"/>
    <text x="452" y="-5" text-anchor="middle" fill="#fef08a">1024</text>
    <text x="452" y="100" text-anchor="middle" fill="#fde047" font-size="9">Yr 11</text>
  </g>

  <!-- Bottom Feature Pills -->
  <g transform="translate(52, 254)" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
    <rect x="0" y="0" width="148" height="24" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="74" y="16" text-anchor="middle" fill="#dbeafe">260 Main Lottery Spots</text>

    <rect x="158" y="0" width="148" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="232" y="16" text-anchor="middle" fill="#d1fae5">50–75 Waitlist Ranks</text>

    <rect x="316" y="0" width="158" height="24" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="395" y="16" text-anchor="middle" fill="#fef3c7">1M Trials in ~0.8s</text>
  </g>
</svg>
