<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="220" rx="16" fill="url(#flowBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Step 1: Data Sources -->
  <g transform="translate(26, 32)">
    <rect width="215" height="156" rx="12" fill="#090d16" fill-opacity="0.65" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="107" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" fill="#38bdf8">
      1. Flexible Data Ingestion
    </text>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">
      <text x="18" y="56">• wser.org/lottery&lt;YEAR&gt;.html</text>
      <text x="18" y="78">• Local cache (~/tmp/)</text>
      <text x="18" y="100">• CSV / TSV (--file)</text>
      <text x="18" y="122">• Inline CLI (--categories)</text>
      <text x="18" y="142" fill="#94a3b8" font-size="10.5">Validates HTTP 2xx &amp; table rows</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="246" y1="80" x2="288" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="246" y1="145" x2="288" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2A: Monte Carlo Engine -->
  <g transform="translate(296, 22)">
    <rect width="340" height="82" rx="12" fill="#090d16" fill-opacity="0.65" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#34d399">
      2A. Zero-Allocation Parallel Monte Carlo
    </text>
    <text x="18" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      Flat IntArray ticket tables + generation-stamped deduplication
    </text>
    <text x="18" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#6ee7b7">
      1,000,000 trials × 335 draws in ~0.81s (L1-resident)
    </text>
  </g>

  <!-- Step 2B: Analytical Wallenius Engine -->
  <g transform="translate(296, 116)">
    <rect width="340" height="82" rx="12" fill="#090d16" fill-opacity="0.65" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#fbbf24">
      2B. Wallenius Exponential Race Solver
    </text>
    <text x="18" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      Arrival time T_j ~ Exp(w_j) + Newton-Raphson critical time t*
    </text>
    <text x="18" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#fde68a">
      Edgeworth skew-normal quadrature in ~6.8ms
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="642" y1="80" x2="684" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="642" y1="145" x2="684" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Cross-Validated Output -->
  <g transform="translate(692, 32)">
    <rect width="282" height="156" rx="12" fill="#090d16" fill-opacity="0.65" stroke="#a855f7" stroke-width="1.5"/>
    <text x="141" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800" fill="#c084fc">
      3. Cross-Validated Outcomes
    </text>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">
      <text x="18" y="56">• Main Lottery (Draws 1–260)</text>
      <text x="18" y="78">• Cumulative Waitlist (Top 10 / 25 / 50 / 75)</text>
      <text x="18" y="100">• 10-Runner Waitlist Buckets (1-10..71-75)</text>
      <text x="18" y="122">• Side-by-Side MC vs. Formula Diff</text>
      <text x="18" y="142" fill="#d8b4fe" font-size="10.5">Verified with Kotlin Power-Assert tests</text>
    </g>
  </g>
</svg>
